name: turnover
description: "Cronómetro para partidos de Blood Bowl."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  audioplayers: ^6.8.1
  wakelock_plus: ^1.8.0
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/
    - assets/images/

# El icono de la aplicación. Los ficheros de assets/branding/ no se empaquetan:
# son la fuente desde la que se generan los iconos de cada plataforma, y no se
# leen en tiempo de ejecución. Se regenera con:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  # El icono adaptativo recorta hasta un 25% por lado según la forma que elija
  # el lanzador, así que el dibujo va en el centro y el fondo lo pone el tema.
  adaptive_icon_background: "#0B0F19"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_monochrome: assets/branding/icon_foreground.png
  # iOS no admite transparencia en el icono: se aplana contra el fondo del tema.
  remove_alpha_ios: true
  background_color_ios: "#0B0F19"

# La pantalla de arranque. Se regenera con:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B0F19"
  image: assets/branding/splash.png
  # Android 12 en adelante recorta el dibujo en un círculo y lo dibuja más
  # pequeño, así que lleva su propia versión con margen.
  android_12:
    color: "#0B0F19"
    image: assets/branding/splash_android12.png
    icon_background_color: "#0B0F19"
